; Виртуальная клавиатура и трекпад (USB HID + BLE HID)
; Плата: Guition JC4827W543C (ESP32-S3 N4R8, NV3041A 480x272 QSPI, тач GT911)

[platformio]
default_envs = jc4827w543

[env:jc4827w543]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
; у платы в board.json ARDUINO_USB_MODE=1 (USB-Serial/JTAG); HID нужен TinyUSB
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-порт в режиме OTG (TinyUSB): HID-клавиатура/мышь + CDC для логов и прошивки
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DUSB_PRODUCT="ESP32 Keyboard"'
    '-DUSB_MANUFACTURER="EspKeyboard"'
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    moononournation/GFX Library for Arduino@1.6.8
    lvgl/lvgl@8.3.11
